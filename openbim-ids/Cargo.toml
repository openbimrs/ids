[package]
name = "openbim-ids"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ids"
homepage = "https://github.com/openbimrs/ids"
documentation = "https://docs.rs/openbim-ids"
readme = "README.md"
description = "buildingSMART IDS (Information Delivery Specification)."
keywords = ["bim", "openbim", "ifc", "aec"]
categories = ["parser-implementations", "data-structures"]

[dependencies]
openbim-core = "0.1.0"
roxmltree = { version = "0.21.1", default-features = false, features = ["std", "positions"] }
