[package]
name = "openbim-ids"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/ids"
homepage = "https://github.com/openbimrs/ids"
documentation = "https://docs.rs/openbim-ids"
readme = "README.md"
description = "buildingSMART IDS (Information Delivery Specification)."
keywords = ["bim", "openbim", "ifc", "aec"]
categories = ["parser-implementations", "data-structures"]

[dependencies]
openbim-core = "0.1.0"
roxmltree = { version = "0.21.1", default-features = false, features = ["std", "positions"] }
# Audit features only. `ifc-schema` is AGPL-3.0-or-later; `ifc-template-catalog`
# is AGPL-3.0-or-later AND CC-BY-ND-4.0 (embedded template data). Enabling a
# feature puts those terms on the resulting work; see LICENSING.md.
ifc-schema = { version = "0.3.1", optional = true, default-features = false, features = ["ifc2x3", "ifc4", "ifc4x3"] }
ifc-template-catalog = { version = "0.2.1", optional = true, default-features = false, features = ["embedded"] }
regex = { version = "1.11", optional = true, default-features = false, features = ["std", "unicode"] }

[features]
default = []
## Audit IDS documents against the IFC schemas of their listed releases,
## without the standard property set templates (AGPL-3.0-or-later only).
audit-schema = ["dep:ifc-schema", "dep:regex"]
## `audit-schema` plus the standard Pset_/Qto_ template checks
## (adds CC-BY-ND-4.0 template data).
audit = ["audit-schema", "dep:ifc-template-catalog"]

[[example]]
name = "audit_dir"
required-features = ["audit-schema"]

[package.metadata.docs.rs]
all-features = true
